<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ログイン | EGG HATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 共通トークン・ナビ・フォーム部品を再利用 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/egg-hatch.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/egg-hatch-work.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/egg-hatch-apply.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/egg-hatch-login.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/egg-hatch-crosslink.css') }}">
</head>
<body class="eggWorkBody">
<div class="eggCrossBanner eggCrossBanner--toRelay">📖 番外編 -リレー漫画- 公開中：みんなで一本の漫画をつなぐ公式リレー企画 <a href="egg-hatch-relay.html">見てみる →</a></div>

  <header class="eggWorkNav">
    <a class="eggWorkNavHome" href="/">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EGG HATCH" class="eggWorkNavLogo">
      <span>EGG HATCH</span>
    </a>
    <a class="eggWorkNavBack" href="/">← トップへ戻る</a>
  </header>

  <main class="eggLoginPage">

    <div class="eggApplyHead">
      <h1 class="eggApplyWorkTitle">ログイン / 新規登録</h1>
      <p class="eggApplyWorkTheme">応募したり、作品を投稿したりするには、ログインが必要です。</p>
    </div>

    <div class="eggLoginTabs">
      <button type="button" class="eggApplyTypeBtn is-active" data-tab="login">ログイン</button>
      <button type="button" class="eggApplyTypeBtn" data-tab="register">はじめての方(新規登録)</button>
    </div>

    <section class="eggWorkBlock eggLoginPanel is-active" id="eggLoginPanelLogin">
      <form id="eggLoginForm">
        <div style="margin-bottom:14px;">
          <label class="eggWorkBlockTitle" style="font-size:13px;">メールアドレス</label>
          <input class="eggApplyInput" type="email" id="eggLoginEmail" required>
        </div>
        <div style="margin-bottom:14px;">
          <label class="eggWorkBlockTitle" style="font-size:13px;">パスワード</label>
          <input class="eggApplyInput" type="password" id="eggLoginPassword" required>
        </div>
        <p class="eggApplyError" id="eggLoginError" hidden></p>
        <button type="submit" class="eggWorkApplyBtn">ログインする</button>
      </form>
      <p class="eggApplyHint" style="margin-top:14px;">
        お試し用アカウント:<br>
        tachibana@example.com / password123(発案者)<br>
        kamiya@example.com / password123(応募者)
      </p>
    </section>

    <section class="eggWorkBlock eggLoginPanel" id="eggLoginPanelRegister">
      <form id="eggRegisterForm">
        <div style="margin-bottom:14px;">
          <label class="eggWorkBlockTitle" style="font-size:13px;">表示名</label>
          <input class="eggApplyInput" type="text" id="eggRegisterName" placeholder="例：紙谷 まひろ" required>
        </div>
        <div style="margin-bottom:14px;">
          <label class="eggWorkBlockTitle" style="font-size:13px;">メールアドレス</label>
          <input class="eggApplyInput" type="email" id="eggRegisterEmail" required>
        </div>
        <div style="margin-bottom:14px;">
          <label class="eggWorkBlockTitle" style="font-size:13px;">パスワード(8文字以上)</label>
          <input class="eggApplyInput" type="password" id="eggRegisterPassword" minlength="8" required>
        </div>
        <p class="eggApplyError" id="eggRegisterError" hidden></p>
        <button type="submit" class="eggWorkApplyBtn">登録してはじめる</button>
      </form>
    </section>

  </main>

<script src="{{ url_for('static', filename='js/egg-hatch-auth.js') }}?v=1"></script>
<script src="{{ url_for('static', filename='js/egg-hatch-login.js') }}?v=1"></script>
</body>
</html>
